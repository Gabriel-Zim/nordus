name: ${COMPOSE_PROJECT_NAME:-nordus-podman}
services:
  nordus:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/nordus-podman:${NORDUS_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${NORDUS_DATA_ROOT:?Run setup.sh first}:${NORDUS_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/nordus-podman.sock
    environment:
      HOME: ${NORDUS_DATA_ROOT}
      NORDUS_DATA_DIR: ${NORDUS_DATA_ROOT}/.nordus
      NORDUS_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/nordus-podman.sock
      NORDUS_PORT: ${NORDUS_PORT:-8799}
      NORDUS_WEBHOOK_PORT: ${NORDUS_WEBHOOK_PORT:-8800}
      NORDUS_PUBLIC_URL: ${NORDUS_PUBLIC_URL:-http://localhost:8080}
      NORDUS_WEBHOOK_PUBLIC_URL: ${NORDUS_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$NORDUS_PORT/api/health | grep -q nordus']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      nordus:
        condition: service_healthy
    environment:
      NORDUS_HTTP_PORT: ${NORDUS_HTTP_PORT:-8080}
      NORDUS_PORT: ${NORDUS_PORT:-8799}
      NORDUS_WEBHOOK_PORT: ${NORDUS_WEBHOOK_PORT:-8800}
      NORDUS_HTTPS_HOST: ${NORDUS_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
